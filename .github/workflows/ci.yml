# CI for daikieOS — Personal Website 3.0
#
# Runs the same gates a local `npm run qa:all` runs, plus the deploy-artifact
# allowlist check. Deliberately does NOT deploy: publishing is an explicit owner
# action (spec 2026-07-21 §D2), so this workflow proves the branch is shippable
# and stops there.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The browser suite alone took 22.5 min on the GPU-less runner, and the
    # scaled per-test budgets let the slowest viewports finish instead of being
    # cut off at 60s. Headroom so a slow run reports test results rather than
    # being killed mid-suite, which reads as an infrastructure failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Java is required by the pinned W3C Nu validator (vnu-jar).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Font subsetting needs Python fontTools + brotli. Only required for the
      # generation-drift check to be able to REBUILD; the committed subsets are
      # what ship.
      - run: python3 -m pip install --quiet fonttools brotli

      - run: npx playwright install --with-deps chromium webkit

      # Unit tests, generation-drift checks (cases / locale / discovery),
      # structural hardening, HTML Validate and pinned W3C Nu.
      - name: Static gates
        run: npm run qa:static

      - name: Deploy artifact allowlist
        run: npm run check:artifact

      - name: Browser suite (chromium + webkit)
        run: npm run qa:browser

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Lighthouse is a LOCAL pre-ship gate, run here only on request.
  #
  # This runner has no GPU, and the numbers it produces describe that fact
  # rather than the site: the same commit that measures TBT 186ms on a quiet
  # local machine measured 10,319ms here, and 5,494ms on desktop. Gating pushes
  # on those is a permanently red badge that teaches everyone to ignore CI.
  # `npm run qa:perf` (and `qa:perf:network` for the honest production-network
  # figure) is where the performance decision is actually made.
  #
  # On manual dispatch the run still enforces what a software rasteriser can
  # measure truthfully — CLS — and prints the paint metrics as deferred rather
  # than dropping them. See tests/performance/lighthouse-mobile.mjs.
  performance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The deterministic gate. `qa:perf:network` is the honest production-network
      # measurement but depends on a live third-party origin, so it is not a CI
      # blocker — run it locally before shipping.
      - name: Lighthouse (deterministic)
        run: npm run qa:perf
